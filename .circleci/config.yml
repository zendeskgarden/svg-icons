version: 2.1
orbs:
  node: circleci/node@7.2.1

references:
  executor: &executor
    executor:
      name: node/default
      tag: lts

  workspace_root: &workspace_root ~/project

  attach_workspace: &attach_workspace
    attach_workspace:
      at: *workspace_root

jobs:
  build:
    <<: *executor
    steps:
      - checkout
      - node/install-packages:
          cache-version: '{{ .Environment.CACHE_VERSION }}'
      - persist_to_workspace:
          root: *workspace_root
          paths: .

  test:
    <<: *executor
    steps:
      - *attach_workspace
      - run: npm test

  deploy:
    <<: *executor
    environment:
      NODE_DEBUG: gh-pages
    steps:
      - *attach_workspace
      - run: npm run build:demo
      - run: scripts/deploy.mjs

  publish:
    <<: *executor
    steps:
      - *attach_workspace
      - run: npm set //registry.npmjs.org/:_authToken=$NPM_TOKEN
      # `scripts/release.mjs` prints `latest`, `next`, or
      # `v<major>-latest`/`v<major>-next` for versions below npm `latest`, so an
      # older-line hotfix never moves `latest` back.
      - run: |
          DIST_TAG=$(node scripts/release.mjs)
          npm publish --tag "$DIST_TAG"

workflows:
  main:
    jobs:
      # Branch and tag pipelines both run the build and test jobs.
      - build:
          filters: pipeline.git.branch or pipeline.git.tag
      - test:
          requires:
            - build
          filters: pipeline.git.branch or pipeline.git.tag
      # Netlify previews on branches; `main` never deploys from a branch push.
      - deploy:
          name: deploy-preview
          requires:
            - test
          context: writer
          filters: pipeline.git.branch and pipeline.git.branch != "main"
      - publish:
          requires:
            - test
          context: maintainer
          filters: pipeline.git.tag matches /^v\d+\.\d+\.\d+(-\S*)?$/
      # The public demo site tracks npm `latest`: it deploys on final release
      # tags only, after publication succeeds.
      - deploy:
          name: deploy-release
          requires:
            - publish
          context: writer
          filters: pipeline.git.tag matches /^v\d+\.\d+\.\d+$/
